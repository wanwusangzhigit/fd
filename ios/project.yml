# project.yml — XcodeGen project definition for WFDTransfer iOS app.
#
# Generate the .xcodeproj by running:
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# CI does this automatically on the macOS runner.
name: WFDTransfer
options:
  bundleIdPrefix: com.wfd.transfer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_BITCODE: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  WFDTransfer:
    type: application
    platform: iOS
    sources:
      - path: Sources/WFDTransferApp
      - path: Sources/FDFTProtocol
        excludes:
          - "TCPTransport.swift"
          - "Discovery.swift"
      - path: Sources/FDFTProtocol/TCPTransport.swift
      - path: Sources/FDFTProtocol/Discovery.swift
    info:
      path: Sources/WFDTransferApp/Info.plist
      properties:
        CFBundleDisplayName: WFDTransfer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wfd.transfer.app
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone (1) + iPad (2)
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        SUPPORTS_MACCATALIST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/WFDTransferApp/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
