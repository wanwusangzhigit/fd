# project.yml — XcodeGen project definition for WFDTransfer iOS app.
#
# Generate the .xcodeproj by running:
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# CI does this automatically on the macOS runner.
name: WFDTransfer
options:
  bundleIdPrefix: com.wfd.transfer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # Pin Xcode project format to what XcodeGen emits by default. CI runs
  # on macos-15 (Xcode 16 → objectVersion 77); older Xcode 15 would reject
  # this format with "future Xcode project format (77)".
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  FDFTProtocol:
    # Cross-platform Swift protocol layer. Exposed as its own framework
    # target so the app can `import FDFTProtocol`; on Apple platforms
    # SHA-256 goes through CryptoKit (system framework), so we have no
    # external dependencies here. (Linux builds use swift-crypto via
    # the SwiftPM Package.swift at ios/Package.swift instead.)
    type: framework
    platform: iOS
    sources:
      - path: Sources/FDFTProtocol
    settings:
      base:
        PRODUCT_NAME: FDFTProtocol
        PRODUCT_BUNDLE_IDENTIFIER: com.wfd.transfer.FDFTProtocol
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: NO
        SWIFT_VERSION: "5.9"
        # Modern Xcode (16/26) requires every bundled target to have an
        # Info.plist — either supplied or auto-generated. The framework
        # doesn't ship a hand-written one, so let Xcode synthesize it.
        GENERATE_INFOPLIST_FILE: YES

  WFDTransfer:
    type: application
    platform: iOS
    sources:
      - path: Sources/WFDTransferApp
        excludes:
          # Info.plist is referenced explicitly via `info.path` below —
          # don't let XcodeGen also add it as a regular source file.
          - "Info.plist"
    dependencies:
      - target: FDFTProtocol
    info:
      path: Sources/WFDTransferApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wfd.transfer.app
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone (1) + iPad (2)
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_PREVIEWS: YES
        # Asset catalog configuration. APPICON_NAME tells actool which
        # .appiconset inside Assets.xcassets holds the launcher icon —
        # without this actool emits an empty icon set and certain iOS
        # Simulator builds fail at the asset-compilation phase.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # We ship our own Info.plist; suppress Xcode 13+ auto-generation.
        GENERATE_INFOPLIST_FILE: NO
