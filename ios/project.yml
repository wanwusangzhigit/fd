# project.yml — XcodeGen project definition for WFDTransfer iOS app.
#
# Generate the .xcodeproj by running:
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# CI does this automatically on the macOS runner.
name: WFDTransfer
options:
  bundleIdPrefix: com.wfd.transfer
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  # Pin Xcode project format to what XcodeGen emits by default. CI runs
  # on macos-15 (Xcode 16 → objectVersion 77); older Xcode 15 would reject
  # this format with "future Xcode project format (77)".
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
targets:
  WFDTransfer:
    type: application
    platform: iOS
    sources:
      - path: Sources/FDFTProtocol
      - path: Sources/WFDTransferApp
        excludes:
          # Info.plist is referenced explicitly via `info.path` below —
          # don't let XcodeGen also add it as a regular source file.
          - "Info.plist"
    info:
      path: Sources/WFDTransferApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wfd.transfer.app
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone (1) + iPad (2)
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        ENABLE_PREVIEWS: YES
        # We ship our own Info.plist; suppress Xcode 13+ auto-generation.
        GENERATE_INFOPLIST_FILE: NO
