name: Native (Linux + Windows)

# Scoped to the native module on purpose. The iOS and Android jobs live in
# ios.yml / android.yml: with everything in one file and `paths: native/**`,
# a commit touching only ios/ or app/ never started a workflow, so those jobs
# went weeks without running (see the five consecutive "Fix iOS build" commits).
on:
  push:
    branches: [main, master]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Native client: Linux build + tests
  # ---------------------------------------------------------------------------
  native-linux:
    name: Native (Linux GCC)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libbluetooth-dev libncursesw5-dev

      - name: Configure (Release)
        run: cmake -S . -B ../build/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ../build/native -j

      # No `-E discovery` any more. tests/test_discovery.cpp soft-skips (exit 0)
      # when the broadcast bind is refused or no peer answers, so it costs
      # nothing on a runner and still catches real regressions on a host with a
      # network — excluding it was giving up a test for free.
      - name: Test
        run: ctest --test-dir ../build/native --output-on-failure --timeout 30

      - name: Package (.deb)
        run: cpack -G DEB
        working-directory: build/native

      - name: Verify .deb produced
        run: |
          ls -la *.deb
          dpkg -c *.deb | head -20
        working-directory: build/native

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: wfd_transfer-linux-deb
          path: build/native/wfd_transfer-*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Native client: Windows cross-compile via MinGW-w64
  # ---------------------------------------------------------------------------
  native-windows:
    name: Native (Windows MinGW cross)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          # NB: apt package uses hyphen `x86-64`, not underscore `x86_64`.
          # Both `g++-mingw-w64-x86-64-posix` (POSIX threads) and the
          # generic `mingw-w64` meta-package work; we pick the former so
          # `std::thread` / `std::mutex` use the same runtime as our host
          # toolchain expectations.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            mingw-w64 g++-mingw-w64-x86-64-posix

      - name: Configure (cross)
        run: |
          cmake -S . -B ../build/win64 -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86_64.cmake \
                -DCMAKE_BUILD_TYPE=Release

      # Full build, not `--target wfd_transfer`: this is the only place the
      # Win32 GUI (GuiApp.cpp, Win32Util.cpp, wfd_gui.rc + manifest) and the
      # Windows side of the unit tests are compiled at all.
      - name: Build
        run: cmake --build ../build/win64 -j

      - name: Verify every executable was produced
        run: |
          test -f ../build/win64/wfd_transfer.exe
          test -f ../build/win64/wfd_gui.exe
          test -f ../build/win64/test_ui_model.exe
          ls -la ../build/win64/*.exe

      # Allowlist rather than the old "no libstdc++" blacklist: a new accidental
      # dynamic dependency (libwinpthread, some stray MinGW port DLL) would have
      # slipped past that grep, and single-file copy-out is the whole point of
      # building static. test_ui_model.exe is not checked — it is built for
      # compile coverage only and a Linux runner cannot execute it.
      - name: Static-link check (DLL allowlist)
        run: |
          set -eo pipefail
          allowed=' kernel32.dll user32.dll gdi32.dll comctl32.dll comdlg32.dll shell32.dll ole32.dll rpcrt4.dll uuid.dll ws2_32.dll msvcrt.dll advapi32.dll bcrypt.dll ntdll.dll winmm.dll imm32.dll shcore.dll uxtheme.dll crypt32.dll iphlpapi.dll setupapi.dll dwmapi.dll sechost.dll profapi.dll version.dll bthprops.cpl winspool.drv '
          status=0
          for exe in wfd_transfer wfd_gui; do
            echo "== $exe.exe"
            imports=$(x86_64-w64-mingw32-objdump -p "../build/win64/$exe.exe" \
                        | awk 'tolower($1)=="dll" && tolower($2)=="name:" {print tolower($3)}')
            if [ -z "$imports" ]; then
              echo "ERROR: no import table read from $exe.exe" >&2
              status=1
              continue
            fi
            while IFS= read -r dll; do
              case "$allowed" in
                *" $dll "*) echo "   ok: $dll" ;;
                *) echo "   ERROR: unexpected dynamic dependency: $dll" >&2; status=1 ;;
              esac
            done <<< "$imports"
          done
          exit $status

      - name: Package (.zip)
        run: cpack -G ZIP
        working-directory: build/win64

      # The GUI is only "shipped" if it actually landed in the archive.
      - name: Verify zip contents
        run: |
          set -eo pipefail
          ls -la *.zip
          unzip -l *.zip
          unzip -l *.zip | grep -E 'wfd_gui\.exe$'
          unzip -l *.zip | grep -E 'wfd_transfer\.exe$'
        working-directory: build/win64

      - name: Upload .zip
        uses: actions/upload-artifact@v4
        with:
          name: wfd_transfer-windows-zip
          path: build/win64/wfd_transfer-*.zip
          if-no-files-found: error
