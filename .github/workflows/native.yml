name: Build & Test

on:
  push:
    branches: [main, master]
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'native/**'
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Native client: Linux build + tests
  # ---------------------------------------------------------------------------
  native-linux:
    name: Native (Linux GCC)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache \
            libbluetooth-dev libncursesw5-dev

      - name: Configure (Release)
        run: cmake -S . -B ../build/native -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ../build/native -j

      - name: Test
        run: ctest --test-dir ../build/native --output-on-failure -E 'discovery' --timeout 30

      - name: List build dir (debug aid)
        run: ls -la ../build/native/

      - name: Package (.deb)
        run: cpack -G DEB
        working-directory: build/native

      - name: Verify .deb produced
        run: |
          ls -la *.deb
          dpkg -c *.deb | head -20
        working-directory: build/native

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: wfd_transfer-linux-deb
          path: build/native/wfd_transfer-*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Native client: Windows cross-compile via MinGW-w64
  # ---------------------------------------------------------------------------
  native-windows:
    name: Native (Windows MinGW cross)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: native

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          # NB: apt package uses hyphen `x86-64`, not underscore `x86_64`.
          # Both `g++-mingw-w64-x86-64-posix` (POSIX threads) and the
          # generic `mingw-w64` meta-package work; we pick the former so
          # `std::thread` / `std::mutex` use the same runtime as our host
          # toolchain expectations.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            mingw-w64 g++-mingw-w64-x86-64-posix

      - name: Configure (cross)
        run: |
          cmake -S . -B ../build/win64 -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-x86_64.cmake \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build ../build/win64 -j --target wfd_transfer

      - name: Static-link sanity check (no libstdc++ DLL)
        run: |
          if x86_64-w64-mingw32-objdump -p ../build/win64/wfd_transfer.exe \
               | grep -E 'DLL Name: (libstdc|libgcc|libwinpthread)'; then
            echo "ERROR: dynamic runtime DLLs detected" >&2
            exit 1
          fi
          echo "OK: fully static"

      - name: Package (.zip)
        run: cpack -G ZIP
        working-directory: build/win64

      - name: Upload .zip
        uses: actions/upload-artifact@v4
        with:
          name: wfd_transfer-windows-zip
          path: build/win64/wfd_transfer-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS / iPadOS SwiftPM — protocol library + tests on Linux runner
  # ---------------------------------------------------------------------------
  ios-spm-linux:
    name: iOS (SwiftPM on Linux)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test --parallel

      - name: Smoke-test the CLI
        run: |
          mkdir -p /tmp/wfd-cli-test
          echo hello > /tmp/wfd-cli-test/x.txt
          swift run wfd-cli hash /tmp/wfd-cli-test/x.txt
          swift run wfd-cli version

  # ---------------------------------------------------------------------------
  # iOS / iPadOS app — Xcode build via XcodeGen on macOS runner
  # ---------------------------------------------------------------------------
  ios-app-mac:
    name: iOS App (Xcode on macOS)
    # macos-15 ships with Xcode 16 which can open project format 77
    # (XcodeGen emits the latest format by default). macos-14 (Xcode 15)
    # only understands format 56 and rejects newer projects.
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode installation
        run: |
          ls -la /Applications/ | grep -i xcode || true
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Build app for iPad Simulator
        run: |
          set -eo pipefail
          xcodebuild \
            -project WFDTransfer.xcodeproj \
            -scheme WFDTransfer \
            -destination 'platform=iOS Simulator,name=iPad (10th generation),OS=latest' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty

      - name: Build app for iPhone Simulator (iPad-catalyst fallback)
        # If iPad 10th gen isn't available (e.g. on a future image), fall
        # back to whatever iOS Simulator is registered. We use a generic
        # destination so this works regardless of which iPhone/iPad models
        # the runner happens to ship.
        run: |
          set -eo pipefail
          xcodebuild \
            -project WFDTransfer.xcodeproj \
            -scheme WFDTransfer \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            build | xcpretty || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfdtransfer-ios-build
          path: |
            ios/build/DerivedData/**/*.app
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Android build (Gradle)
  # ---------------------------------------------------------------------------
  android:
    name: Android (Gradle)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          cd ..
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: |
          cd ..
          ./gradlew testDebugUnitTest --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
